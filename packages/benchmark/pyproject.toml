[project]
name = "llmopt-benchmark"
version = "0.1.0.dev0"
description = "Benchmark planning contracts for Orionix"
requires-python = ">=3.12"
dependencies = [
  "llmopt-common",
  "llmopt-schemas",
  "pydantic==2.11.7",
]

[tool.uv.sources]
llmopt-common = { workspace = true }
llmopt-schemas = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
