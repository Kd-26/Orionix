[project]
name = "llmopt-workspace"
version = "0.1.0.dev0"
description = "Development tooling for the Orionix LLM optimization monorepo"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "mypy==1.17.0",
  "pip-audit==2.9.0",
  "pre-commit==4.6.2",
  "pytest==9.0.3",
  "pytest-cov==6.2.1",
  "ruff==0.12.4",
]

[tool.uv.workspace]
members = [
  "packages/*",
  "apps/cli",
  "agent",
  "services/*",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "unit: isolated CPU-only unit tests",
  "integration: subsystem integration tests",
  "contract: serialized-contract compatibility tests",
  "smoke: basic installation and startup tests",
  "gpu: requires CUDA-capable hardware",
  "slow: long-running tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["uv.lock"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
files = ["packages", "apps", "agent", "services", "tests"]
exclude = ["build", "dist"]

[tool.coverage.run]
branch = true
source = [
  "llmopt_agent",
  "llmopt_benchmark",
  "llmopt_capsule",
  "llmopt_cli",
  "llmopt_common",
  "llmopt_domain",
  "llmopt_integrations",
  "llmopt_optimizer",
  "llmopt_schemas",
  "llmopt_telemetry",
]
