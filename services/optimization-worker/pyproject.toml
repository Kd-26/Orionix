[project]
name = "llmopt-optimization-worker"
version = "0.1.0.dev0"
description = "Optimization worker composition boundary for Orionix"
requires-python = ">=3.12"
dependencies = [
  "llmopt-common",
  "llmopt-optimizer",
  "llmopt-schemas",
]

[tool.uv.sources]
llmopt-common = { workspace = true }
llmopt-optimizer = { workspace = true }
llmopt-schemas = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
