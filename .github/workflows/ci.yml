name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate lockfile
        run: uv lock --check
      - name: Install locked workspace
        run: uv sync --all-packages --all-groups --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy .
      - name: Unit tests
        run: uv run pytest -m unit
      - name: Contract tests
        run: uv run pytest -m contract
      - name: Repository security invariants
        run: uv run pytest -m security
      - name: Import boundaries and integration tests
        run: uv run pytest -m integration
      - name: Package and CLI smoke tests
        run: uv run pytest -m smoke
      - name: Build every package
        run: uv build --all-packages
